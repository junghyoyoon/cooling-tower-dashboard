<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Calculate cooling tower savings</title>
<script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
<style>
    :root{
      --bg:#0D1D2A;
      --panel:#0D1D2A;
      --line:#1D5868;
      --text:#E6F2F6;
      --muted:#B9D3DC;
      --accent:#8cd7f0;
      --good:#8cd7f0;
      --radius:16px;
      --shadow:0 10px 30px rgba(0,0,0,.22);
      --container:1440px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#0D1D2A;
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    img,svg,canvas{max-width:100%;display:block}
    .wrap{
      width:min(100% - 32px, var(--container));
      margin:0 auto;
      padding:24px 0 40px;
    }
    h1{margin:0 0 12px 0;font-size:clamp(21px, 2.2vw, 30px);
      line-height:1.05;
      color:#8cd7f0;
      letter-spacing:1.2px;
      font-weight:800;
      font-family:'Century Gothic','AppleGothic','Avenir Next',sans-serif;
    }
    .layout{
      display:grid;
      grid-template-columns:minmax(170px, 200px) minmax(0, 1fr);
      gap:20px;
      align-items:start;
    }
    .panel,.plot-card,.hero-card{
      background:#0D1D2A;
      border:1px solid rgba(140,215,240,0.14);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .panel{
      padding:12px;
      background:rgba(255,255,255,0.02);
      backdrop-filter:blur(2px);
    }
    .controls{
      position:sticky;
      top:16px;
      max-height:calc(100svh - 32px);
      overflow:auto;
      scrollbar-width:thin;
    }
    h2{margin:0 0 10px 0;font-size:17px; line-height:1.15; font-family:'Century Gothic','AppleGothic','Avenir Next',sans-serif; font-weight:700}
    h3{margin:14px 0 8px 0;font-size:15px}
    .grid2{
      display:grid;
      grid-template-columns:1fr;
      gap:6px;
    }
    .grid2 > div{
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      min-width:0;
    }
    .grid2 label{
      display:flex;
      align-items:flex-end;
      min-height:22px;
      line-height:1.15;
      margin-bottom:3px;
      color:var(--muted);
      font-size:12px;
      letter-spacing:0.1px;
    }
    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:4px;
    }
    input{
      width:100%;
      min-height:36px;
      padding:4px 8px;
      border:1px solid var(--line);
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      background:#F7FBFD;
      color:#062F3A;
      appearance:textfield;
    }
    input:focus{
      outline:none;
      border-color:#8cd7f0;
      box-shadow:0 0 0 3px rgba(140,215,240,0.18);
    }
    select{
      width:100%;
      min-height:36px;
      padding:4px 8px;
      border:1px solid var(--line);
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      background:#F7FBFD;
      color:#062F3A;
    }
    select:focus{
      outline:none;
      border-color:#8cd7f0;
      box-shadow:0 0 0 3px rgba(140,215,240,0.18);
    }
    .btnrow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
      width:100%;
    }
    button{
      width:100%;
      border:none;
      line-height:1.15;
      background:var(--accent);
      color:#062F3A;
      min-height:52px;
      padding:10px 14px;
      border-radius:10px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(140,215,240,0.22);
      transition:transform .15s ease, opacity .15s ease;
    }
    button:hover{transform:translateY(-1px)}
    button:active{transform:translateY(0)}
    button.secondary{
      background:#174C59;
      color:#E6F2F6;
      box-shadow:none;
    }
    details{
      margin-top:14px;
      border:2px solid #8cd7f0;
      border-radius:12px;
      padding:10px 12px;
      background:#0d1d2a;
      color:#E6F2F6;
      box-shadow:0 8px 24px rgba(0,0,0,0.22);
    }
    
    summary{
      cursor:pointer;
      font-weight:700;
      list-style:none;
      display:flex;
      align-items:center;
      gap:6px;
      font-size:13px;
    }
    #advToggle{
      display:inline-block;
      width:14px;
      text-align:center;
      transition:transform .18s ease;
      color:#8cd7f0;
    }
    details[open] #advToggle{
      transform:rotate(90deg);
    }

    summary::-webkit-details-marker{display:none}
    .hero-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:10px;
      margin-bottom:16px;
      align-items:stretch;
    }
    .hero-card{
      padding:12px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(140,215,240,0.18);
      box-shadow:0 10px 30px rgba(0,0,0,0.28);

      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap:12px;
    }
    .hero-card .label{
      flex:1 1 auto;
      font-size:16px;
      font-weight:700;
      min-height:auto;
      display:flex;
      align-items:flex-start;
      color:#FFFFFF;
      margin-bottom:0;
      opacity:1;
      letter-spacing:.2px;
      line-height:1.2;

      align-items:flex-end;

      text-align:right;
      margin-left:auto;

    .figgrid{

      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:16px;
      align-items:stretch;
    }
    .plot-card{
      padding:12px;
      background:transparent;
      border:1px solid rgba(140,215,240,0.10);
      box-shadow:0 10px 30px rgba(0,0,0,0.22);
      min-width:0;
    }
    .section-title{
      font-size:15px;
      font-weight:700;
      margin-bottom:10px;
      color:#8cd7f0;
    }
    .plot{
      width:100%;
      height:300px;
    }
    .summarybox{
      margin-top:14px;
      font-size:13px;
      line-height:1.5;
      background:#f8fafc;
      border:1px solid #e8edf5;
      border-radius:12px;
      padding:10px 12px;
      white-space:pre-line;
    }

    /* Large desktop */
    @media (min-width:1400px){
      .plot{height:320px}
    }

    /* Laptop / small desktop */
    @media (max-width:1279px){
      .layout{
        grid-template-columns:minmax(170px, 200px) minmax(0, 1fr);
      }
      .hero-grid{
        grid-template-columns:repeat(4, minmax(0, 1fr));
      }
      .plot{height:280px}
    }

    /* Tablet */
    @media (max-width:1199px){
      .figgrid{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
      .plot{height:320px}
    }

    @media (max-width:1023px){
      .wrap{width:min(100% - 24px, var(--container)); padding-top:16px}
      .layout{
        grid-template-columns:1fr;
        gap:16px;
      }
      .controls{
        position:static;
        max-height:none;
        overflow:visible;
      }
      .hero-grid{

      }
      .figgrid{

      .wrap{width:min(100% - 16px, var(--container)); padding-top:14px}
      .grid2{
        grid-template-columns:1fr;
      }

        min-height:auto;
      }
      .hero-grid{
        grid-template-columns:1fr;
      }
      .btnrow{
        flex-direction:column;
      }
      button{
        width:100%;
      }
      .plot{
        height:340px;
      }
      .section-title{
        font-size:16px;
      }
    }

  }
  
  .image-placeholder img{

    max-width:520px;
  }
}


/* hero diagram layout polish */

  align-items:center;

.image-placeholder img{

@media (max-width:768px){

.submission-note{

}


</style>
</head>

<script>
const defaults = {
  CT_TR_Unit:500, C_MU:400, CoC:3,
  cost_MU:4, cost_SW:10, cost_E:0.15, Operation_duty_pct:50, Inflation_rate_pct:3, Lifetime_years:20, NONA_CapEx_unit:55000,
  V_Sump_ratio:3, Q_HR:15000, Drift_frac:0.005/100, t_BD_duration:5,
  t_total:8*60, dt:0.01, hours_year:3720, E_motor:0.0212, Motor_eff:0.9,
  NONA_Unit_Capacity_f:10, RR_NONA:0.9, Duty_Target_pct:99, C_BD_Deadband:250, C_B_upper:1000, C_B_lower:900
};
const GOOGLE_APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbx8RtXJTs_BWQF29EmYMdfVL_ICoes1_LCu-724W7X6eyZpmpo-f9EV8BifC1ntF99qhA/exec';

const getVal = id => parseFloat(document.getElementById(id).value);
const getText = id => (document.getElementById(id).value || '').trim();
const setVal = (id,v) => document.getElementById(id).value=v;
const setLogStatus = (msg, isError=false) => {
  const el = document.getElementById('logStatus');
  if(!el) return;
  el.textContent = msg || '';
  el.style.color = isError ? '#FFB4B4' : 'var(--muted)';
};
function linspaceStep(start,end,step){const a=[]; for(let x=start;x<=end+1e-12;x+=step)a.push(+x.toFixed(10)); return a;}
function mean(arr){let s=0,n=0; for(const v of arr){ if(Number.isFinite(v)){s+=v;n++;}} return n?s/n:NaN;}
function maxArr(arr){let m=-Infinity, ok=false; for(const v of arr){ if(Number.isFinite(v)){m=Math.max(m,v); ok=true;}} return ok?m:NaN;}
function minArr(arr){let m=Infinity, ok=false; for(const v of arr){ if(Number.isFinite(v)){m=Math.min(m,v); ok=true;}} return ok?m:NaN;}
function sumArr(arr){return arr.reduce((a,b)=>a+b,0);}
function money(v){return Number.isFinite(v)?Math.round(v).toLocaleString():'-';}
function vol(v){return Number.isFinite(v)?Math.round(v).toLocaleString():'-';}
function interpLinear(xs,ys,x){ if(x<=xs[0]) return ys[0]; if(x>=xs[xs.length-1]) return ys[ys.length-1]; for(let i=0;i<xs.length-1;i++){ if(x>=xs[i] && x<=xs[i+1]){ const t=(x-xs[i])/(xs[i+1]-xs[i]); return ys[i] + t*(ys[i+1]-ys[i]); } } return ys[ys.length-1]; }

function predict_NONA_from_feedC(feedC){
  const Feed_table=[800,850,900,950,1000,1050,1100,1150,1200,1250,1300,1350,1400,1450,1500,1550,1600,1650,1700,1750,1800,1850,1900,1950,2000,2050,2100,2150,2200,2250];
  const Product_table=[375.8485,382.9719,390.6936,398.9138,407.5413,416.4970,425.7170,435.1555,444.7870,454.6077,464.6367,474.9159,485.5091,496.5006,507.9927,520.1023,532.9577,546.6930,561.4444,577.3439,594.5147,613.0654,633.0850,654.6382,677.7609,702.4572,728.6960,756.4099,785.4939,815.8061];
  const SEC_table=[6.0414,6.6492,7.4842,8.4496,9.4431,10.3748,11.1838,11.8453,12.3713,12.8008,13.1857,13.5753,14.0035,14.4820,15.0011,15.5354,16.0537,16.5289,16.9449,17.3005,17.6074,17.8864,18.1607,18.4506,18.7694,19.1212,19.5013,19.8973,20.2905,20.6574];
  return {Product_C_uScm: interpLinear(Feed_table, Product_table, feedC), SEC_kWh_kgal: interpLinear(Feed_table, SEC_table, feedC)};
}


function buildLoggingPayload(p){
  return {
    timestamp: new Date().toISOString(),
    country: getText('country'),
    coolingTowerSizeTR: p.CT_TR_Unit,
    makeupConductivity: p.C_MU,
    CoC: p.CoC,
    makeupWaterCost: p.cost_MU,
    sewerCost: p.cost_SW,
    electricityCost: p.cost_E,
    operationDuty: p.Operation_duty_pct,
    inflationRate: p.Inflation_rate * 100,
    lifetime: p.Lifetime_years
  };
}

async function logInputsToGoogleSheet(payload){
  if(!GOOGLE_APPS_SCRIPT_URL || GOOGLE_APPS_SCRIPT_URL.includes('PASTE_YOUR_WEB_APP_URL_HERE')){
    setLogStatus('Logging is not connected yet. Paste your Apps Script web app URL into GOOGLE_APPS_SCRIPT_URL.');
    return;
  }

  try{
    await fetch(GOOGLE_APPS_SCRIPT_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: {'Content-Type': 'text/plain;charset=utf-8'},
      body: JSON.stringify(payload)
    });

    setLogStatus('Inputs submitted.'); console.log('Logging fetch sent');
  }catch(err){
    setLogStatus('Logging request could not be sent.');
    throw err;
  }
}

function buildParams(){
  const p={};
  p.CT_TR_Unit=getVal('CT_TR_Unit');
  p.CT_Number=1;
  p.CT_TR_Total=p.CT_TR_Unit;
  p.C_MU=getVal('C_MU');
  p.CoC=getVal('CoC');
  p.C_BD_Deadband=defaults.C_BD_Deadband;
  p.C_BD_upper=p.CoC*p.C_MU;
  p.C_BD_lower=p.C_BD_upper-p.C_BD_Deadband;
  p.C_Sump_init=p.C_MU*p.CoC-p.C_BD_Deadband;
  p.C_B_upper=defaults.C_B_upper;
  p.C_B_lower=defaults.C_B_lower;
  p.NONA_Unit_Capacity_f=defaults.NONA_Unit_Capacity_f;
  p.RR_NONA=defaults.RR_NONA;
  p.Duty_Target_pct=defaults.Duty_Target_pct;
  p.V_Sump_ratio=defaults.V_Sump_ratio;
  p.V_Sump=p.V_Sump_ratio*p.CT_TR_Total;
  p.Q_HR=defaults.Q_HR;
  p.Q_Evp_per_TR=p.Q_HR/(1000*8.34*60);
  p.Q_Circ=3.6*p.CT_TR_Total;
  p.Drift_frac=defaults.Drift_frac;
  p.Q_CT_Evp=p.Q_Evp_per_TR*p.CT_TR_Total;
  p.Q_CT_Drift=p.Q_Circ*p.Drift_frac;
  p.Q_CT_BD=p.Q_CT_Evp/(p.CoC-1)-p.Q_CT_Drift;
  p.Q_CT_MU=p.Q_CT_Evp+p.Q_CT_Drift+p.Q_CT_BD;
  p.t_BD_duration=defaults.t_BD_duration;
  const C_ss_conc=(p.Q_CT_Evp+p.Q_CT_Drift)/p.Q_CT_Drift*p.C_MU;
  const ratio=(p.C_BD_upper-C_ss_conc)/(p.C_BD_lower-C_ss_conc);
  p.t_BD_Interval=-p.V_Sump/p.Q_CT_Drift*Math.log(ratio);
  p.V_BD_Interval=p.Q_CT_BD*p.t_BD_Interval;
  p.Q_BD_Bleed=p.V_BD_Interval/p.t_BD_duration;
  p.t_total=defaults.t_total; p.dt=defaults.dt;
  p.E_motor=defaults.E_motor; p.Motor_eff=defaults.Motor_eff;
  p.cost_MU=getVal('cost_MU'); p.cost_SW=getVal('cost_SW'); p.cost_E=getVal('cost_E');
  p.Operation_duty_pct=getVal('Operation_duty_pct');
  p.hours_year=8760*(p.Operation_duty_pct/100);
  p.Inflation_rate=getVal('Inflation_rate_pct')/100; p.Lifetime_years=getVal('Lifetime_years'); p.NONA_CapEx_unit=defaults.NONA_CapEx_unit;
  return p;
}

function computeBase(p,time){
  const n=time.length;
  const C=Array(n).fill(0), Q_WW=Array(n).fill(0), Q_BD=Array(n).fill(0), Q_MU=Array(n).fill(0);
  C[0]=p.C_Sump_init; let is_bleeding=false;
  for(let i=0;i<n-1;i++){
    const C_now=C[i]; let QMU=0, QBD=0, C_next=C_now;
    if(!is_bleeding){
      QMU=p.Q_CT_Evp+p.Q_CT_Drift;
      C_next=C_now+((QMU*p.C_MU-p.Q_CT_Drift*C_now)/p.V_Sump)*p.dt;
      if(C_next>=p.C_BD_upper){C_next=p.C_BD_upper; is_bleeding=true;}
    } else {
      QMU=p.Q_CT_Evp+p.Q_CT_Drift+p.Q_BD_Bleed;
      C_next=C_now+((QMU*p.C_MU-(p.Q_CT_Drift+p.Q_BD_Bleed)*C_now)/p.V_Sump)*p.dt;
      QBD=p.Q_BD_Bleed;
      if(C_next<=p.C_BD_lower){C_next=p.C_BD_lower; is_bleeding=false;}
    }
    C[i+1]=C_next; Q_BD[i]=QBD; Q_WW[i]=QBD; Q_MU[i]=QMU;
  }
  Q_BD[n-1]=Q_BD[n-2]; Q_WW[n-1]=Q_WW[n-2]; Q_MU[n-1]=Q_MU[n-2];
  return {C,Q_WW,Q_BD,Q_MU};
}

function runNonaCaseContinuous_modelA(p,time,Qfset,Qpset,Qbset){
  const n=time.length;
  const C=Array(n).fill(0), Q_WW=Array(n).fill(0), Q_BD=Array(n).fill(0), Q_MU=Array(n).fill(0), Qp=Array(n).fill(0), Qb=Array(n).fill(0), Qf=Array(n).fill(0), SEC=Array(n).fill(0), Cp=Array(n).fill(NaN);
  C[0]=p.C_Sump_init; let is_bleeding=false;
  for(let i=0;i<n-1;i++){
    const C_now=C[i];
    if(!is_bleeding && C_now>=p.C_BD_upper) is_bleeding=true;
    else if(is_bleeding && C_now<=p.C_BD_lower) is_bleeding=false;
    const pred=predict_NONA_from_feedC(Math.min(Math.max(C_now,800),2250));
    const QBD=is_bleeding?p.Q_BD_Bleed:0;
    const QMU=p.Q_CT_Evp+p.Q_CT_Drift+QBD+Qbset;
    let C_next=C_now+((QMU*p.C_MU+Qpset*pred.Product_C_uScm-(p.Q_CT_Drift+QBD+Qfset)*C_now)/p.V_Sump)*p.dt;
    if(C_next<p.C_MU) C_next=p.C_MU;
    C[i+1]=C_next; Q_BD[i]=QBD; Q_WW[i]=QBD+Qbset; Q_MU[i]=QMU; Qp[i]=Qpset; Qb[i]=Qbset; Qf[i]=Qfset; SEC[i]=pred.SEC_kWh_kgal; Cp[i]=pred.Product_C_uScm;
  }
  Q_BD[n-1]=Q_BD[n-2]; Q_WW[n-1]=Q_WW[n-2]; Q_MU[n-1]=Q_MU[n-2]; Qp[n-1]=Qp[n-2]; Qb[n-1]=Qb[n-2]; Qf[n-1]=Qf[n-2]; SEC[n-1]=SEC[n-2]; Cp[n-1]=Cp[n-2];
  return {C,Q_WW,Q_BD,Q_MU,Qp,Qb,Qf,SEC,Cp};
}

function runNonaCaseControlled_modelA(p,time,Qfset,Qpset,Qbset){
  const n=time.length;
  const C=Array(n).fill(0), Q_WW=Array(n).fill(0), Q_BD=Array(n).fill(0), Q_MU=Array(n).fill(0), Qp=Array(n).fill(0), Qb=Array(n).fill(0), Qf=Array(n).fill(0), SEC=Array(n).fill(0), Cp=Array(n).fill(NaN);
  C[0]=p.C_Sump_init; let is_bleeding=false, is_nona_on=true;
  for(let i=0;i<n-1;i++){
    const C_now=C[i];
    if(!is_bleeding && C_now>=p.C_BD_upper) is_bleeding=true;
    else if(is_bleeding && C_now<=p.C_BD_lower) is_bleeding=false;
    if(!is_nona_on && C_now>=p.C_B_upper) is_nona_on=true;
    else if(is_nona_on && C_now<=p.C_B_lower) is_nona_on=false;
    let Qf_now=0,Qp_now=0,Qb_now=0,Cp_now=NaN,SEC_now=0;
    if(is_nona_on){
      const pred=predict_NONA_from_feedC(Math.min(Math.max(C_now,800),2250));
      Qf_now=Qfset; Qp_now=Qpset; Qb_now=Qbset; Cp_now=pred.Product_C_uScm; SEC_now=pred.SEC_kWh_kgal;
    }
    const QBD=is_bleeding?p.Q_BD_Bleed:0;
    const QMU=p.Q_CT_Evp+p.Q_CT_Drift+QBD+Qb_now;
    const Cp_eff=Qp_now>0?Cp_now:0;
    let C_next=C_now+((QMU*p.C_MU+Qp_now*Cp_eff-(p.Q_CT_Drift+QBD+Qf_now)*C_now)/p.V_Sump)*p.dt;
    if(C_next<p.C_MU) C_next=p.C_MU;
    C[i+1]=C_next; Q_BD[i]=QBD; Q_WW[i]=QBD+Qb_now; Q_MU[i]=QMU; Qp[i]=Qp_now; Qb[i]=Qb_now; Qf[i]=Qf_now; SEC[i]=SEC_now; Cp[i]=Cp_now;
  }
  Q_BD[n-1]=Q_BD[n-2]; Q_WW[n-1]=Q_WW[n-2]; Q_MU[n-1]=Q_MU[n-2]; Qp[n-1]=Qp[n-2]; Qb[n-1]=Qb[n-2]; Qf[n-1]=Qf[n-2]; SEC[n-1]=SEC[n-2]; Cp[n-1]=Cp[n-2];
  return {C,Q_WW,Q_BD,Q_MU,Qp,Qb,Qf,SEC,Cp};
}

function evaluateCase(label,units,result,p,base){
  const V_MU_kgal=mean(result.Q_MU)*60*p.hours_year/1000, V_WW_kgal=mean(result.Q_WW)*60*p.hours_year/1000, C_sump_avg=mean(result.C), V_NONA_p_kgal=mean(result.Qp)*60*p.hours_year/1000;
  const secList=result.SEC.filter((v,i)=>result.Qp[i]>0 && Number.isFinite(v));
  const NONA_SEC_avg=secList.length?mean(secList):NaN;
  const Chem_factor=1e-3;
  const cost_Chem=C_sump_avg*(0.6+0.35*C_sump_avg/1000+0.25*Math.pow(C_sump_avg/1000,2))*Chem_factor;
  const NONA_OpEx_E=(Number.isFinite(NONA_SEC_avg)?NONA_SEC_avg:0)*V_NONA_p_kgal*p.cost_E;
  const NONA_OpEx_Main=2500*units;
  const OpEx_MU=p.cost_MU*V_MU_kgal, OpEx_SW=p.cost_SW*V_WW_kgal, OpEx_Chem=cost_Chem*V_MU_kgal;
  const annualOpExTotal=base.CT_OpEx_E_base+NONA_OpEx_E+NONA_OpEx_Main+OpEx_MU+OpEx_SW+OpEx_Chem;
  const annualSaving=base.CT_OpEx_Total_base-annualOpExTotal;
  const lifetimeSaving=sumArr(Array.from({length:p.Lifetime_years},(_,k)=>annualSaving*Math.pow(1+p.Inflation_rate,k)));
  const capex=p.NONA_CapEx_unit*units;
  return {label, units, result, V_MU_kgal, V_WW_kgal, annualSaving, lifetimeSaving, MU_Saving_kgal:base.V_MU_base_kgal-V_MU_kgal, WW_Reduction_kgal:base.V_WW_base_kgal-V_WW_kgal, annualBreakdown:[OpEx_MU,OpEx_SW,NONA_OpEx_E,NONA_OpEx_Main,OpEx_Chem], annualOpExTotal, capex};
}

function computeBaseSummary(p,baseRaw){
  const V_MU_base_kgal=mean(baseRaw.Q_MU)*60*p.hours_year/1000, V_WW_base_kgal=mean(baseRaw.Q_WW)*60*p.hours_year/1000, C_Sump_base_avg=mean(baseRaw.C);
  const Chem_factor=1e-3;
  const cost_Chem_base=C_Sump_base_avg*(0.6+0.35*C_Sump_base_avg/1000+0.25*Math.pow(C_Sump_base_avg/1000,2))*Chem_factor;
  const CT_OpEx_E_base=p.CT_TR_Total*p.E_motor/p.Motor_eff*p.cost_E*p.hours_year;
  const CT_OpEx_MU_base=p.cost_MU*V_MU_base_kgal;
  const CT_OpEx_SW_base=p.cost_SW*V_WW_base_kgal;
  const CT_OpEx_Chem_base=cost_Chem_base*V_MU_base_kgal;
  const CT_OpEx_Total_base=CT_OpEx_E_base+CT_OpEx_MU_base+CT_OpEx_SW_base+CT_OpEx_Chem_base;
  return {result:baseRaw, V_MU_base_kgal, V_WW_base_kgal, C_Sump_base_avg, CT_OpEx_E_base, CT_OpEx_MU_base, CT_OpEx_SW_base, CT_OpEx_Chem_base, CT_OpEx_Total_base};
}

function findBestCase(p,time,base){
  let best=null, selectedA=1;
  for(let k=1;k<=1000;k++){
    const a=k, ap1=a+1;
    const QfA=defaults.NONA_Unit_Capacity_f*a, QpA=defaults.RR_NONA*QfA, QbA=QfA-QpA;
    const rA=runNonaCaseContinuous_modelA(p,time,QfA,QpA,QbA);
    const cA=evaluateCase(`A${a}`,a,rA,p,base);

    const QfB=defaults.NONA_Unit_Capacity_f*ap1, QpB=defaults.RR_NONA*QfB, QbB=QfB-QpB;
    const rB=runNonaCaseControlled_modelA(p,time,QfB,QpB,QbB);
    const cB=evaluateCase(`A${ap1}+`,ap1,rB,p,base);

    if(best===null || cA.annualSaving>best.annualSaving) best=cA;
    if(cB.annualSaving>best.annualSaving) best=cB;

    const dutyB=100*mean(rB.Qf)/QfB;
    if(dutyB<=defaults.Duty_Target_pct){selectedA=a; break;}
  }
  return {best, selectedA};
}





function animatePlot(divId, initialData, finalData, layout){
  const config = {responsive:true,displaylogo:false,displayModeBar:false,scrollZoom:false,doubleClick:false};
  Plotly.newPlot(divId, initialData, layout, config).then(()=>{
    Plotly.animate(divId, {
      data: finalData,
      traces: finalData.map((_,i)=>i)
    }, {
      transition:{duration:700,easing:'cubic-in-out'},
      frame:{duration:700,redraw:false},
      mode:'immediate'
    });
  });
}


function animateLineDraw(divId, xValues, ySeriesList, seriesStyles, layout){
  const config = {responsive:true,displaylogo:false,displayModeBar:false,scrollZoom:false,doubleClick:false};
  const n = xValues.length;
  const step = Math.max(1, Math.floor(n / 35));
  const initialData = seriesStyles.map(style => ({
    ...style,
    x: [xValues[0]],
    y: [style.fullY[0]]
  }));
  const frames = [];
  for(let i = 1; i <= n; i += step){
    const idx = Math.min(i, n);
    frames.push({
      data: seriesStyles.map(style => ({
        x: xValues.slice(0, idx),
        y: style.fullY.slice(0, idx)
      }))
    });
  }
  if(frames.length === 0 || frames[frames.length - 1].data[0].x.length !== n){
    frames.push({
      data: seriesStyles.map(style => ({
        x: xValues.slice(),
        y: style.fullY.slice()
      }))
    });
  }

  Plotly.newPlot(divId, initialData, layout, config).then(() => {
    Plotly.addFrames(divId, frames);
    Plotly.animate(divId, null, {
      frame:{duration:8, redraw:false},
      transition:{duration:0},
      mode:'immediate'
    });
  });
}

      {x:xArrow, y:(opexBase + opexNONA)/2, xref:'paper', yref:'y', text:`-${opexPctReduction.toFixed(0)}%`, showarrow:false, font:{size:16,color:'#66C7E3'}, xanchor:'center', yanchor:'middle', bgcolor:'#111d29'}
    ]
  };
  const fig4Initial = [
    {x:[labelBase,labelNONA],y:[0,0],type:'bar',marker:{color:['#7F8C96','#8cd7f0']},showlegend:false}
  ];
  const fig4Final = [
    {x:[labelBase,labelNONA],y:[opexBase,opexNONA],type:'bar',marker:{color:['#7F8C96','#8cd7f0']},showlegend:false}
  ];
  animatePlot('fig4', fig4Initial, fig4Final, fig4Layout);
}

function animateHeroValue(el, target, unitText, isMoney=false){
  const duration = 650;
  const start = performance.now();
  const from = 0;
  function frame(now){
    const t = Math.min((now - start) / duration, 1);
    const eased = 1 - Math.pow(1 - t, 3);
    const val = Math.round(from + (target - from) * eased);
    const prefix = isMoney ? '$' : '';
    el.innerHTML = '<span class="big">'+prefix+val.toLocaleString()+'</span>' + (unitText ? '<span class="unit">'+unitText+'</span>' : '');
    if(t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
}

function updateHero(best){
  animateHeroValue(document.getElementById('heroMU'), Math.round(best.MU_Saving_kgal), 'kgal/yr', false);
  animateHeroValue(document.getElementById('heroWW'), Math.round(best.WW_Reduction_kgal), 'kgal/yr', false);
  animateHeroValue(document.getElementById('heroAnnual'), Math.round(best.annualSaving), '/yr', true);
  animateHeroValue(document.getElementById('heroLifetime'), Math.round(best.lifetimeSaving), '20 years, 3% Inflation', true);
}

async function runAll(){
  const btn = document.getElementById('runBtn');
  try{
    btn.disabled = true;
    btn.textContent = 'Calculating...';
    setLogStatus('');

    const p=buildParams();
    const time=linspaceStep(0,p.t_total,p.dt);
    const timeHours=time.map(v=>v/60);
    const baseRaw=computeBase(p,time);
    const base=computeBaseSummary(p,baseRaw);
    const result=findBestCase(p,time,base);
    updateHero(result.best);
    plotFigures(p,timeHours,base,result.best);

    await logInputsToGoogleSheet(buildLoggingPayload(p));
  } catch(err){
    console.error(err);
    setLogStatus('Calculation worked, but input logging failed.', true);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Calculate';
  }
}

document.getElementById('inquiryBtn').addEventListener('click',()=>{ window.open('https://www.nona-technologies.com/contact-3','_blank'); });
document.getElementById('runBtn').addEventListener('click',()=>{ runAll(); });
window.addEventListener('resize',()=>{
  const isMobile = window.innerWidth <= 639;
  if(document.getElementById('fig1')){
    Plotly.relayout('fig1',{
      'legend.y': isMobile ? -0.42 : -0.30,
      'margin.b': isMobile ? 108 : 92
    });
  }
});
window.addEventListener('load',runAll);
</script>
