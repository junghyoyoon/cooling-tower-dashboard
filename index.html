<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cooling Tower Savings Calculator</title>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
  
  <style>
    :root{
      --bg:#0D1D2A;
      --panel:#0D1D2A;
      --line:#1D5868;
      --text:#E6F2F6;
      --muted:#B9D3DC;
      --accent:#8cd7f0;
      --good:#8cd7f0;
      --radius:16px;
      --shadow:0 10px 30px rgba(0,0,0,.22);
      --container:1440px;
    }
    *{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{
      margin:0;
      font-family:sans-serif;
      background:#0D1D2A;
      color:var(--text);
      -webkit-font-smoothing:antialiased;
      text-rendering:optimizeLegibility;
    }
    img,svg,canvas{max-width:100%;display:block}
    .wrap{
      width:min(100% - 32px, var(--container));
      margin:0 auto;
      padding:24px 0 40px;
    }
    h1{margin:0 0 12px 0;font-size:clamp(21px, 2.2vw, 30px);
      line-height:1.05;
      color:#8cd7f0;
      letter-spacing:1.2px;
      font-weight:800;
    }
    .layout{
      display:grid;
      grid-template-columns:minmax(220px, 250px) minmax(0, 1fr);
      gap:20px;
      align-items:start;
    }
    .panel,.plot-card,.hero-card{
      background:#0D1D2A;
      border:1px solid rgba(140,215,240,0.14);
      border-radius:var(--radius);
      box-shadow:var(--shadow);
    }
    .panel{
      padding:12px;
      background:rgba(255,255,255,0.02);
      backdrop-filter:blur(2px);
    }
    .controls{
      position:sticky;
      top:16px;
      max-height:calc(100svh - 32px);
      overflow:auto;
      scrollbar-width:thin;
    }
    h2{margin:0 0 10px 0;font-size:17px}
    h3{margin:14px 0 8px 0;font-size:15px}
    .grid2{
      display:grid;
      grid-template-columns:1fr;
      gap:6px;
    }
    .grid2 > div{
      display:flex;
      flex-direction:column;
      justify-content:flex-start;
      min-width:0;
    }
    .grid2 label{
      display:flex;
      align-items:flex-end;
      min-height:22px;
      line-height:1.15;
      margin-bottom:3px;
      color:var(--muted);
      font-size:12px;
      letter-spacing:0.1px;
    }
    label{
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:4px;
    }
    input{
      width:100%;
      min-height:36px;
      padding:4px 8px;
      border:1px solid var(--line);
      border-radius:10px;
      font-size:15px;
      font-weight:700;
      background:#F7FBFD;
      color:#062F3A;
      appearance:textfield;
    }
    input:focus{
      outline:none;
      border-color:#8cd7f0;
      box-shadow:0 0 0 3px rgba(140,215,240,0.18);
    }
    .btnrow{
      display:flex;
      gap:8px;
      flex-wrap:wrap;
      margin-top:10px;
    }
    button{
      border:none;
      background:var(--accent);
      color:#062F3A;
      min-height:52px;
      padding:10px 14px;
      border-radius:10px;
      font-size:14px;
      font-weight:700;
      cursor:pointer;
      box-shadow:0 6px 18px rgba(140,215,240,0.22);
      transition:transform .15s ease, opacity .15s ease;
    }
    button:hover{transform:translateY(-1px)}
    button:active{transform:translateY(0)}
    button.secondary{
      background:#174C59;
      color:#E6F2F6;
      box-shadow:none;
    }
    details{
      margin-top:14px;
      border:2px solid #8cd7f0;
      border-radius:12px;
      padding:10px 12px;
      background:#0d1d2a;
      color:#E6F2F6;
      box-shadow:0 8px 24px rgba(0,0,0,0.22);
    }
    
    summary{
      cursor:pointer;
      font-weight:700;
      list-style:none;
      display:flex;
      align-items:center;
      gap:6px;
      font-size:13px;
    }
    #advToggle{
      display:inline-block;
      width:14px;
      text-align:center;
      transition:transform .18s ease;
      color:#8cd7f0;
    }
    details[open] #advToggle{
      transform:rotate(90deg);
    }

    summary::-webkit-details-marker{display:none}
    .hero-grid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:10px;
      margin-bottom:16px;
      align-items:stretch;
    }
    .hero-card{
      padding:12px;
      background:rgba(255,255,255,.04);
      border:1px solid rgba(140,215,240,0.18);
      box-shadow:0 10px 30px rgba(0,0,0,0.28);
      backdrop-filter:blur(2px);
      min-width:0;
    }
    .hero-card .label{
      font-size:12px;
      min-height:32px;
      display:flex;
      align-items:flex-end;
      color:var(--muted);
      margin-bottom:8px;
      opacity:.85;
      letter-spacing:.2px;
    }
    .hero-card .value{
      font-size:clamp(18px, 1.6vw, 26px);
      line-height:1.05;
      font-weight:800;
      color:var(--good);
      overflow-wrap:anywhere;
      min-height:28px;
      display:flex;
      align-items:flex-start;
    }
    .figgrid{
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:16px;
      align-items:stretch;
    }
    .plot-card{
      padding:12px;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(140,215,240,0.10);
      box-shadow:0 10px 30px rgba(0,0,0,0.22);
      min-width:0;
    }
    .section-title{
      font-size:15px;
      font-weight:700;
      margin-bottom:10px;
      color:#8cd7f0;
    }
    .plot{
      width:100%;
      height:300px;
    }
    .summarybox{
      margin-top:14px;
      font-size:13px;
      line-height:1.5;
      background:#f8fafc;
      border:1px solid #e8edf5;
      border-radius:12px;
      padding:10px 12px;
      white-space:pre-line;
    }

    /* Large desktop */
    @media (min-width:1400px){
      .plot{height:320px}
    }

    /* Laptop / small desktop */
    @media (max-width:1279px){
      .layout{
        grid-template-columns:minmax(220px, 250px) minmax(0, 1fr);
      }
      .hero-grid{
        grid-template-columns:repeat(4, minmax(0, 1fr));
      }
      .plot{height:280px}
    }

    /* Tablet */
    @media (max-width:1199px){
      .figgrid{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
      .plot{height:320px}
    }

    @media (max-width:1023px){
      .wrap{width:min(100% - 24px, var(--container)); padding-top:16px}
      .layout{
        grid-template-columns:1fr;
        gap:16px;
      }
      .controls{
        position:static;
        max-height:none;
        overflow:visible;
      }
      .hero-grid{
        grid-template-columns:repeat(2, minmax(0, 1fr));
      }
      .figgrid{
        grid-template-columns:1fr;
      }
      .plot{height:420px}
    }

    /* Mobile */
    @media (max-width:639px){
      .wrap{width:min(100% - 16px, var(--container)); padding-top:14px}
      .grid2{
        grid-template-columns:1fr;
      }
      .grid2 label{
        min-height:auto;
      }
      .hero-grid{
        grid-template-columns:1fr;
      }
      .btnrow{
        flex-direction:column;
      }
      button{
        width:100%;
      }
      .plot{
        height:340px;
      }
      .section-title{
        font-size:16px;
      }
    }

    .image-placeholder{
      width:100%;
      height:min(40vh, 420px);
      border:1px dashed rgba(140,215,240,0.25);
      border-radius:var(--radius);
      margin:0 0 20px 0;
      background:rgba(255,255,255,0.015);
    }

  </style>

</head>
<body>
<div class="wrap">
  <h1>Cooling Tower Savings with NONA RECOVER</h1>
  

  <div class="image-placeholder" aria-hidden="true"></div>

  <div class="layout">
    <div class="panel controls">
      <h2>Customer Inputs</h2>
      <div class="grid2">
        <div><label>Cooling Tower Size (TR)</label><input id="CT_TR_Unit" type="number" step="any" value="1000"></div>
        <div><label># of Installed Cooling Tower</label><input id="CT_Number" type="number" step="1" value="1"></div>
        <div><label>Makeup Water Conductivity (µS/cm)</label><input id="C_MU" type="number" step="any" value="400"></div>
        <div><label>Current CoC for Operation</label><input id="CoC" type="number" step="any" value="3"></div>
      </div>

      <details>
        <summary><span id="advToggle">▸</span> Advanced Parameters</summary>
        <div class="grid2" style="margin-top:10px;">
          <div><label>Makeup Water Cost ($/kgal)</label><input id="cost_MU" type="number" step="any" value="4"></div>
          <div><label>Sewer Cost ($/kgal)</label><input id="cost_SW" type="number" step="any" value="10"></div>
          <div><label>Electricity Cost ($/kWh)</label><input id="cost_E" type="number" step="any" value="0.15"></div>
          <div><label>Yearly Operation Duty (%)</label><input id="Operation_duty_pct" type="number" step="any" value="50"></div>
          <div><label>Inflation Rate (%)</label><input id="Inflation_rate_pct" type="number" step="any" value="3"></div>
          <div><label>Lifetime (years)</label><input id="Lifetime_years" type="number" step="1" value="20"></div>
          
        </div>
      </details>

      <div class="btnrow">
        <button id="runBtn">Calculate</button>
        <button id="resetBtn" class="secondary">Reset Default</button>
      </div>
    </div>

    <div>
      <div class="hero-grid">
        <div class="hero-card"><div class="label">Annual Makeup Water<br>Saving Volume</div><div class="value" id="heroMU">-</div></div>
        <div class="hero-card"><div class="label">Annual Wastewater<br>Reduction Volume</div><div class="value" id="heroWW">-</div></div>
        <div class="hero-card"><div class="label">First-Year Annual Saving</div><div class="value" id="heroAnnual">-</div></div>
        <div class="hero-card"><div class="label">Lifetime Saving</div><div class="value" id="heroLifetime">-</div></div>
      </div>

      <div class="figgrid">
        <div class="plot-card"><div id="fig1" class="plot"></div></div>
        <div class="plot-card"><div id="fig2" class="plot"></div></div>
        <div class="plot-card"><div id="fig3" class="plot"></div></div>
        <div class="plot-card"><div id="fig4" class="plot"></div></div>
      </div>
    </div>
  </div>
</div>

<script>
const defaults = {
  CT_TR_Unit:1000, CT_Number:1, C_MU:400, CoC:3,
  cost_MU:4, cost_SW:10, cost_E:0.15, Operation_duty_pct:50, Inflation_rate_pct:3, Lifetime_years:20, NONA_CapEx_unit:55000,
  V_Sump_ratio:3, Q_HR:15000, Drift_frac:0.005/100, t_BD_duration:5,
  t_total:8*60, dt:0.01, hours_year:3720, E_motor:0.0212, Motor_eff:0.9,
  NONA_Unit_Capacity_f:10, RR_NONA:0.9, Duty_Target_pct:99, C_BD_Deadband:250, C_B_upper:1000, C_B_lower:900
};
const getVal = id => parseFloat(document.getElementById(id).value);
const setVal = (id,v) => document.getElementById(id).value=v;
function linspaceStep(start,end,step){const a=[]; for(let x=start;x<=end+1e-12;x+=step)a.push(+x.toFixed(10)); return a;}
function mean(arr){let s=0,n=0; for(const v of arr){ if(Number.isFinite(v)){s+=v;n++;}} return n?s/n:NaN;}
function maxArr(arr){let m=-Infinity, ok=false; for(const v of arr){ if(Number.isFinite(v)){m=Math.max(m,v); ok=true;}} return ok?m:NaN;}
function minArr(arr){let m=Infinity, ok=false; for(const v of arr){ if(Number.isFinite(v)){m=Math.min(m,v); ok=true;}} return ok?m:NaN;}
function sumArr(arr){return arr.reduce((a,b)=>a+b,0);}
function money(v){return Number.isFinite(v)?'$'+Math.round(v).toLocaleString():'-';}
function vol(v){return Number.isFinite(v)?Math.round(v).toLocaleString()+' kgal/yr':'-';}
function interpLinear(xs,ys,x){ if(x<=xs[0]) return ys[0]; if(x>=xs[xs.length-1]) return ys[ys.length-1]; for(let i=0;i<xs.length-1;i++){ if(x>=xs[i] && x<=xs[i+1]){ const t=(x-xs[i])/(xs[i+1]-xs[i]); return ys[i] + t*(ys[i+1]-ys[i]); } } return ys[ys.length-1]; }

function predict_NONA_from_feedC(feedC){
  const Feed_table=[800,850,900,950,1000,1050,1100,1150,1200,1250,1300,1350,1400,1450,1500,1550,1600,1650,1700,1750,1800,1850,1900,1950,2000,2050,2100,2150,2200,2250];
  const Product_table=[375.8485,382.9719,390.6936,398.9138,407.5413,416.4970,425.7170,435.1555,444.7870,454.6077,464.6367,474.9159,485.5091,496.5006,507.9927,520.1023,532.9577,546.6930,561.4444,577.3439,594.5147,613.0654,633.0850,654.6382,677.7609,702.4572,728.6960,756.4099,785.4939,815.8061];
  const SEC_table=[6.0414,6.6492,7.4842,8.4496,9.4431,10.3748,11.1838,11.8453,12.3713,12.8008,13.1857,13.5753,14.0035,14.4820,15.0011,15.5354,16.0537,16.5289,16.9449,17.3005,17.6074,17.8864,18.1607,18.4506,18.7694,19.1212,19.5013,19.8973,20.2905,20.6574];
  return {Product_C_uScm: interpLinear(Feed_table, Product_table, feedC), SEC_kWh_kgal: interpLinear(Feed_table, SEC_table, feedC)};
}

function buildParams(){
  const p={};
  p.CT_TR_Unit=getVal('CT_TR_Unit');
  p.CT_Number=getVal('CT_Number');
  p.CT_TR_Total=p.CT_TR_Unit*p.CT_Number;
  p.C_MU=getVal('C_MU');
  p.CoC=getVal('CoC');
  p.C_BD_Deadband=defaults.C_BD_Deadband;
  p.C_BD_upper=p.CoC*p.C_MU;
  p.C_BD_lower=p.C_BD_upper-p.C_BD_Deadband;
  p.C_Sump_init=p.C_MU*p.CoC-p.C_BD_Deadband;
  p.C_B_upper=defaults.C_B_upper;
  p.C_B_lower=defaults.C_B_lower;
  p.NONA_Unit_Capacity_f=defaults.NONA_Unit_Capacity_f;
  p.RR_NONA=defaults.RR_NONA;
  p.Duty_Target_pct=defaults.Duty_Target_pct;
  p.V_Sump_ratio=defaults.V_Sump_ratio;
  p.V_Sump=p.V_Sump_ratio*p.CT_TR_Total;
  p.Q_HR=defaults.Q_HR;
  p.Q_Evp_per_TR=p.Q_HR/(1000*8.34*60);
  p.Q_Circ=3.6*p.CT_TR_Total;
  p.Drift_frac=defaults.Drift_frac;
  p.Q_CT_Evp=p.Q_Evp_per_TR*p.CT_TR_Total;
  p.Q_CT_Drift=p.Q_Circ*p.Drift_frac;
  p.Q_CT_BD=p.Q_CT_Evp/(p.CoC-1)-p.Q_CT_Drift;
  p.Q_CT_MU=p.Q_CT_Evp+p.Q_CT_Drift+p.Q_CT_BD;
  p.t_BD_duration=defaults.t_BD_duration;
  const C_ss_conc=(p.Q_CT_Evp+p.Q_CT_Drift)/p.Q_CT_Drift*p.C_MU;
  const ratio=(p.C_BD_upper-C_ss_conc)/(p.C_BD_lower-C_ss_conc);
  p.t_BD_Interval=-p.V_Sump/p.Q_CT_Drift*Math.log(ratio);
  p.V_BD_Interval=p.Q_CT_BD*p.t_BD_Interval;
  p.Q_BD_Bleed=p.V_BD_Interval/p.t_BD_duration;
  p.t_total=defaults.t_total; p.dt=defaults.dt;
  p.E_motor=defaults.E_motor; p.Motor_eff=defaults.Motor_eff;
  p.cost_MU=getVal('cost_MU'); p.cost_SW=getVal('cost_SW'); p.cost_E=getVal('cost_E');
  p.Operation_duty_pct=getVal('Operation_duty_pct');
  p.hours_year=8760*(p.Operation_duty_pct/100);
  p.Inflation_rate=getVal('Inflation_rate_pct')/100; p.Lifetime_years=getVal('Lifetime_years'); p.NONA_CapEx_unit=defaults.NONA_CapEx_unit;
  return p;
}

function computeBase(p,time){
  const n=time.length;
  const C=Array(n).fill(0), Q_WW=Array(n).fill(0), Q_BD=Array(n).fill(0), Q_MU=Array(n).fill(0);
  C[0]=p.C_Sump_init; let is_bleeding=false;
  for(let i=0;i<n-1;i++){
    const C_now=C[i]; let QMU=0, QBD=0, C_next=C_now;
    if(!is_bleeding){
      QMU=p.Q_CT_Evp+p.Q_CT_Drift;
      C_next=C_now+((QMU*p.C_MU-p.Q_CT_Drift*C_now)/p.V_Sump)*p.dt;
      if(C_next>=p.C_BD_upper){C_next=p.C_BD_upper; is_bleeding=true;}
    } else {
      QMU=p.Q_CT_Evp+p.Q_CT_Drift+p.Q_BD_Bleed;
      C_next=C_now+((QMU*p.C_MU-(p.Q_CT_Drift+p.Q_BD_Bleed)*C_now)/p.V_Sump)*p.dt;
      QBD=p.Q_BD_Bleed;
      if(C_next<=p.C_BD_lower){C_next=p.C_BD_lower; is_bleeding=false;}
    }
    C[i+1]=C_next; Q_BD[i]=QBD; Q_WW[i]=QBD; Q_MU[i]=QMU;
  }
  Q_BD[n-1]=Q_BD[n-2]; Q_WW[n-1]=Q_WW[n-2]; Q_MU[n-1]=Q_MU[n-2];
  return {C,Q_WW,Q_BD,Q_MU};
}

function runNonaCaseContinuous_modelA(p,time,Qfset,Qpset,Qbset){
  const n=time.length;
  const C=Array(n).fill(0), Q_WW=Array(n).fill(0), Q_BD=Array(n).fill(0), Q_MU=Array(n).fill(0), Qp=Array(n).fill(0), Qb=Array(n).fill(0), Qf=Array(n).fill(0), SEC=Array(n).fill(0), Cp=Array(n).fill(NaN);
  C[0]=p.C_Sump_init; let is_bleeding=false;
  for(let i=0;i<n-1;i++){
    const C_now=C[i];
    if(!is_bleeding && C_now>=p.C_BD_upper) is_bleeding=true;
    else if(is_bleeding && C_now<=p.C_BD_lower) is_bleeding=false;
    const pred=predict_NONA_from_feedC(Math.min(Math.max(C_now,800),2250));
    const QBD=is_bleeding?p.Q_BD_Bleed:0;
    const QMU=p.Q_CT_Evp+p.Q_CT_Drift+QBD+Qbset;
    let C_next=C_now+((QMU*p.C_MU+Qpset*pred.Product_C_uScm-(p.Q_CT_Drift+QBD+Qfset)*C_now)/p.V_Sump)*p.dt;
    if(C_next<p.C_MU) C_next=p.C_MU;
    C[i+1]=C_next; Q_BD[i]=QBD; Q_WW[i]=QBD+Qbset; Q_MU[i]=QMU; Qp[i]=Qpset; Qb[i]=Qbset; Qf[i]=Qfset; SEC[i]=pred.SEC_kWh_kgal; Cp[i]=pred.Product_C_uScm;
  }
  Q_BD[n-1]=Q_BD[n-2]; Q_WW[n-1]=Q_WW[n-2]; Q_MU[n-1]=Q_MU[n-2]; Qp[n-1]=Qp[n-2]; Qb[n-1]=Qb[n-2]; Qf[n-1]=Qf[n-2]; SEC[n-1]=SEC[n-2]; Cp[n-1]=Cp[n-2];
  return {C,Q_WW,Q_BD,Q_MU,Qp,Qb,Qf,SEC,Cp};
}

function runNonaCaseControlled_modelA(p,time,Qfset,Qpset,Qbset){
  const n=time.length;
  const C=Array(n).fill(0), Q_WW=Array(n).fill(0), Q_BD=Array(n).fill(0), Q_MU=Array(n).fill(0), Qp=Array(n).fill(0), Qb=Array(n).fill(0), Qf=Array(n).fill(0), SEC=Array(n).fill(0), Cp=Array(n).fill(NaN);
  C[0]=p.C_Sump_init; let is_bleeding=false, is_nona_on=true;
  for(let i=0;i<n-1;i++){
    const C_now=C[i];
    if(!is_bleeding && C_now>=p.C_BD_upper) is_bleeding=true;
    else if(is_bleeding && C_now<=p.C_BD_lower) is_bleeding=false;
    if(!is_nona_on && C_now>=p.C_B_upper) is_nona_on=true;
    else if(is_nona_on && C_now<=p.C_B_lower) is_nona_on=false;
    let Qf_now=0,Qp_now=0,Qb_now=0,Cp_now=NaN,SEC_now=0;
    if(is_nona_on){
      const pred=predict_NONA_from_feedC(Math.min(Math.max(C_now,800),2250));
      Qf_now=Qfset; Qp_now=Qpset; Qb_now=Qbset; Cp_now=pred.Product_C_uScm; SEC_now=pred.SEC_kWh_kgal;
    }
    const QBD=is_bleeding?p.Q_BD_Bleed:0;
    const QMU=p.Q_CT_Evp+p.Q_CT_Drift+QBD+Qb_now;
    const Cp_eff=Qp_now>0?Cp_now:0;
    let C_next=C_now+((QMU*p.C_MU+Qp_now*Cp_eff-(p.Q_CT_Drift+QBD+Qf_now)*C_now)/p.V_Sump)*p.dt;
    if(C_next<p.C_MU) C_next=p.C_MU;
    C[i+1]=C_next; Q_BD[i]=QBD; Q_WW[i]=QBD+Qb_now; Q_MU[i]=QMU; Qp[i]=Qp_now; Qb[i]=Qb_now; Qf[i]=Qf_now; SEC[i]=SEC_now; Cp[i]=Cp_now;
  }
  Q_BD[n-1]=Q_BD[n-2]; Q_WW[n-1]=Q_WW[n-2]; Q_MU[n-1]=Q_MU[n-2]; Qp[n-1]=Qp[n-2]; Qb[n-1]=Qb[n-2]; Qf[n-1]=Qf[n-2]; SEC[n-1]=SEC[n-2]; Cp[n-1]=Cp[n-2];
  return {C,Q_WW,Q_BD,Q_MU,Qp,Qb,Qf,SEC,Cp};
}

function evaluateCase(label,units,result,p,base){
  const V_MU_kgal=mean(result.Q_MU)*60*p.hours_year/1000, V_WW_kgal=mean(result.Q_WW)*60*p.hours_year/1000, C_sump_avg=mean(result.C), V_NONA_p_kgal=mean(result.Qp)*60*p.hours_year/1000;
  const secList=result.SEC.filter((v,i)=>result.Qp[i]>0 && Number.isFinite(v));
  const NONA_SEC_avg=secList.length?mean(secList):NaN;
  const Chem_factor=1e-3;
  const cost_Chem=C_sump_avg*(0.6+0.35*C_sump_avg/1000+0.25*Math.pow(C_sump_avg/1000,2))*Chem_factor;
  const NONA_OpEx_E=(Number.isFinite(NONA_SEC_avg)?NONA_SEC_avg:0)*V_NONA_p_kgal*p.cost_E;
  const NONA_OpEx_Main=2500*units;
  const OpEx_MU=p.cost_MU*V_MU_kgal, OpEx_SW=p.cost_SW*V_WW_kgal, OpEx_Chem=cost_Chem*V_MU_kgal;
  const annualOpExTotal=base.CT_OpEx_E_base+NONA_OpEx_E+NONA_OpEx_Main+OpEx_MU+OpEx_SW+OpEx_Chem;
  const annualSaving=base.CT_OpEx_Total_base-annualOpExTotal;
  const lifetimeSaving=sumArr(Array.from({length:p.Lifetime_years},(_,k)=>annualSaving*Math.pow(1+p.Inflation_rate,k)));
  const capex=p.NONA_CapEx_unit*units;
  return {label, units, result, V_MU_kgal, V_WW_kgal, annualSaving, lifetimeSaving, MU_Saving_kgal:base.V_MU_base_kgal-V_MU_kgal, WW_Reduction_kgal:base.V_WW_base_kgal-V_WW_kgal, annualBreakdown:[OpEx_MU,OpEx_SW,NONA_OpEx_E,NONA_OpEx_Main,OpEx_Chem], annualOpExTotal, capex};
}

function computeBaseSummary(p,baseRaw){
  const V_MU_base_kgal=mean(baseRaw.Q_MU)*60*p.hours_year/1000, V_WW_base_kgal=mean(baseRaw.Q_WW)*60*p.hours_year/1000, C_Sump_base_avg=mean(baseRaw.C);
  const Chem_factor=1e-3;
  const cost_Chem_base=C_Sump_base_avg*(0.6+0.35*C_Sump_base_avg/1000+0.25*Math.pow(C_Sump_base_avg/1000,2))*Chem_factor;
  const CT_OpEx_E_base=p.CT_TR_Total*p.E_motor/p.Motor_eff*p.cost_E*p.hours_year;
  const CT_OpEx_MU_base=p.cost_MU*V_MU_base_kgal;
  const CT_OpEx_SW_base=p.cost_SW*V_WW_base_kgal;
  const CT_OpEx_Chem_base=cost_Chem_base*V_MU_base_kgal;
  const CT_OpEx_Total_base=CT_OpEx_E_base+CT_OpEx_MU_base+CT_OpEx_SW_base+CT_OpEx_Chem_base;
  return {result:baseRaw, V_MU_base_kgal, V_WW_base_kgal, C_Sump_base_avg, CT_OpEx_E_base, CT_OpEx_MU_base, CT_OpEx_SW_base, CT_OpEx_Chem_base, CT_OpEx_Total_base};
}

function findBestCase(p,time,base){
  let best=null, selectedA=1;
  for(let k=1;k<=1000;k++){
    const a=k, ap1=a+1;
    const QfA=defaults.NONA_Unit_Capacity_f*a, QpA=defaults.RR_NONA*QfA, QbA=QfA-QpA;
    const rA=runNonaCaseContinuous_modelA(p,time,QfA,QpA,QbA);
    const cA=evaluateCase(`A${a}`,a,rA,p,base);

    const QfB=defaults.NONA_Unit_Capacity_f*ap1, QpB=defaults.RR_NONA*QfB, QbB=QfB-QpB;
    const rB=runNonaCaseControlled_modelA(p,time,QfB,QpB,QbB);
    const cB=evaluateCase(`A${ap1}+`,ap1,rB,p,base);

    if(best===null || cA.annualSaving>best.annualSaving) best=cA;
    if(cB.annualSaving>best.annualSaving) best=cB;

    const dutyB=100*mean(rB.Qf)/QfB;
    if(dutyB<=defaults.Duty_Target_pct){selectedA=a; break;}
  }
  return {best, selectedA};
}




function plotFigures(p,timeHours,base,best){
  const x=timeHours;
  const labelBase = 'Cooling<br>Tower<br>Only';
  const labelNONA = 'Cooling<br>Tower<br>+ NONA';

  Plotly.react('fig1', [
    {x,y:base.result.C,type:'scatter',mode:'lines',name:'Cooling Tower Only',line:{color:'#7F8C96',width:2}},
    {x,y:best.result.C,type:'scatter',mode:'lines',name:'Cooling Tower<br>+ NONA',line:{color:'#2A8BD4',width:2}}
  ], {
    title:'Sump Tank Conductivity',
    margin:{l:60,r:30,t:60,b:70}, paper_bgcolor:'#0A3F4D', plot_bgcolor:'#0A3F4D', font:{color:'#E6F2F6'},
    xaxis:{title:'Time (hours)',range:[0,p.t_total/60],gridcolor:'#1D5868',zerolinecolor:'#1D5868',tickfont:{color:'#E6F2F6'},titlefont:{color:'#E6F2F6'}},
    yaxis:{title:'Sump tank conductivity (µS/cm)',range:[0.95*minArr([...base.result.C,...best.result.C]),1.05*maxArr([...base.result.C,...best.result.C])],gridcolor:'#1D5868',zerolinecolor:'#1D5868',tickfont:{color:'#E6F2F6'},titlefont:{color:'#E6F2F6'}},
    legend:{orientation:'h',y:-0.18,x:0.5,xanchor:'center',font:{color:'#E6F2F6'}}
  }, {responsive:true,displaylogo:false});

  const waterYMax = 1.05 * maxArr([base.V_MU_base_kgal,best.V_MU_kgal]);
  const muPctReduction = base.V_MU_base_kgal > 0 ? 100 * (base.V_MU_base_kgal - best.V_MU_kgal) / base.V_MU_base_kgal : 0;
  const wwPctReduction = base.V_WW_base_kgal > 0 ? 100 * (base.V_WW_base_kgal - best.V_WW_kgal) / base.V_WW_base_kgal : 0;
  const opexBase = base.CT_OpEx_MU_base + base.CT_OpEx_SW_base + base.CT_OpEx_Chem_base;
  const opexNONA = sumArr(best.annualBreakdown);
  const opexYMax = 1.05 * maxArr([opexBase, opexNONA]);
  const opexPctReduction = opexBase > 0 ? 100 * (opexBase - opexNONA) / opexBase : 0;

  const xBaseRight = 0.36;
  const xArrow = 0.78;

  Plotly.react('fig2', [
    {x:[labelBase,labelNONA],y:[base.V_MU_base_kgal,best.V_MU_kgal],type:'bar',marker:{color:'#8ED1F0'},showlegend:false}
  ], {
    title:'Annual Makeup Water',
    margin:{l:60,r:30,t:60,b:70}, paper_bgcolor:'#0A3F4D', plot_bgcolor:'#0A3F4D', font:{color:'#E6F2F6'},
    xaxis:{title:'',gridcolor:'#1D5868',zerolinecolor:'#1D5868',tickfont:{color:'#E6F2F6'},titlefont:{color:'#E6F2F6'}},
    yaxis:{title:'Annual Makeup Water (kgal/year)',range:[0,waterYMax],gridcolor:'#1D5868',zerolinecolor:'#1D5868',tickfont:{color:'#E6F2F6'},titlefont:{color:'#E6F2F6'}},
    shapes:[
      {type:'line', xref:'paper', yref:'y', x0:xBaseRight, x1:xArrow, y0:base.V_MU_base_kgal, y1:base.V_MU_base_kgal, line:{color:'#66C7E3', width:2, dash:'dot'}}
    ],
    annotations:[
      {x:xArrow, y:base.V_MU_base_kgal, xref:'paper', yref:'y', ax:xArrow, ay:(base.V_MU_base_kgal+best.V_MU_kgal)/2 + (base.V_MU_base_kgal-best.V_MU_kgal)*0.08, axref:'paper', ayref:'y', text:'', showarrow:true, arrowhead:2, arrowsize:1.2, arrowwidth:2, arrowcolor:'#66C7E3'},
      {x:xArrow, y:best.V_MU_kgal, xref:'paper', yref:'y', ax:xArrow, ay:(base.V_MU_base_kgal+best.V_MU_kgal)/2 - (base.V_MU_base_kgal-best.V_MU_kgal)*0.08, axref:'paper', ayref:'y', text:'', showarrow:true, arrowhead:2, arrowsize:1.2, arrowwidth:2, arrowcolor:'#66C7E3'},
      {x:xArrow, y:(base.V_MU_base_kgal + best.V_MU_kgal)/2, xref:'paper', yref:'y', text:`-${muPctReduction.toFixed(0)}%`, showarrow:false, font:{size:16,color:'#66C7E3'}, xanchor:'center', yanchor:'middle', bgcolor:'rgba(10,63,77,0.85)'}
    ]
  }, {responsive:true,displaylogo:false});

  Plotly.react('fig3', [
    {x:[labelBase,labelNONA],y:[base.V_WW_base_kgal,best.V_WW_kgal],type:'bar',marker:{color:'#3A6F8F'},showlegend:false}
  ], {
    title:'Annual Wastewater',
    margin:{l:60,r:30,t:60,b:70}, paper_bgcolor:'#0A3F4D', plot_bgcolor:'#0A3F4D', font:{color:'#E6F2F6'},
    xaxis:{title:'',gridcolor:'#1D5868',zerolinecolor:'#1D5868',tickfont:{color:'#E6F2F6'},titlefont:{color:'#E6F2F6'}},
    yaxis:{title:'Annual Wastewater (kgal/year)',range:[0,waterYMax],gridcolor:'#1D5868',zerolinecolor:'#1D5868',tickfont:{color:'#E6F2F6'},titlefont:{color:'#E6F2F6'}},
    shapes:[
      {type:'line', xref:'paper', yref:'y', x0:xBaseRight, x1:xArrow, y0:base.V_WW_base_kgal, y1:base.V_WW_base_kgal, line:{color:'#66C7E3', width:2, dash:'dot'}}
    ],
    annotations:[
      {x:xArrow, y:base.V_WW_base_kgal, xref:'paper', yref:'y', ax:xArrow, ay:(base.V_WW_base_kgal+best.V_WW_kgal)/2 + (base.V_WW_base_kgal-best.V_WW_kgal)*0.08, axref:'paper', ayref:'y', text:'', showarrow:true, arrowhead:2, arrowsize:1.2, arrowwidth:2, arrowcolor:'#66C7E3'},
      {x:xArrow, y:best.V_WW_kgal, xref:'paper', yref:'y', ax:xArrow, ay:(base.V_WW_base_kgal+best.V_WW_kgal)/2 - (base.V_WW_base_kgal-best.V_WW_kgal)*0.08, axref:'paper', ayref:'y', text:'', showarrow:true, arrowhead:2, arrowsize:1.2, arrowwidth:2, arrowcolor:'#66C7E3'},
      {x:xArrow, y:(base.V_WW_base_kgal + best.V_WW_kgal)/2, xref:'paper', yref:'y', text:`-${wwPctReduction.toFixed(0)}%`, showarrow:false, font:{size:16,color:'#66C7E3'}, xanchor:'center', yanchor:'middle', bgcolor:'rgba(10,63,77,0.85)'}
    ]
  }, {responsive:true,displaylogo:false});

  Plotly.react('fig4', [
    {x:[labelBase,labelNONA],y:[opexBase,opexNONA],type:'bar',marker:{color:'#2A8BD4'},showlegend:false}
  ], {
    title:'Annual OpEx',
    margin:{l:60,r:30,t:60,b:70}, paper_bgcolor:'#0A3F4D', plot_bgcolor:'#0A3F4D', font:{color:'#E6F2F6'},
    xaxis:{title:'',gridcolor:'#1D5868',zerolinecolor:'#1D5868',tickfont:{color:'#E6F2F6'},titlefont:{color:'#E6F2F6'}},
    yaxis:{title:'Annual OpEx ($)',range:[0,opexYMax],gridcolor:'#1D5868',zerolinecolor:'#1D5868',tickfont:{color:'#E6F2F6'},titlefont:{color:'#E6F2F6'}},
    shapes:[
      {type:'line', xref:'paper', yref:'y', x0:xBaseRight, x1:xArrow, y0:opexBase, y1:opexBase, line:{color:'#66C7E3', width:2, dash:'dot'}}
    ],
    annotations:[
      {x:xArrow, y:opexBase, xref:'paper', yref:'y', ax:xArrow, ay:(opexBase+opexNONA)/2 + (opexBase-opexNONA)*0.08, axref:'paper', ayref:'y', text:'', showarrow:true, arrowhead:2, arrowsize:1.2, arrowwidth:2, arrowcolor:'#66C7E3'},
      {x:xArrow, y:opexNONA, xref:'paper', yref:'y', ax:xArrow, ay:(opexBase+opexNONA)/2 - (opexBase-opexNONA)*0.08, axref:'paper', ayref:'y', text:'', showarrow:true, arrowhead:2, arrowsize:1.2, arrowwidth:2, arrowcolor:'#66C7E3'},
      {x:xArrow, y:(opexBase + opexNONA)/2, xref:'paper', yref:'y', text:`-${opexPctReduction.toFixed(0)}%`, showarrow:false, font:{size:16,color:'#66C7E3'}, xanchor:'center', yanchor:'middle', bgcolor:'rgba(10,63,77,0.85)'}
    ]
  }, {responsive:true,displaylogo:false});
}

function updateHero(best){
  document.getElementById('heroMU').textContent=vol(best.MU_Saving_kgal);
  document.getElementById('heroWW').textContent=vol(best.WW_Reduction_kgal);
  document.getElementById('heroAnnual').textContent=money(best.annualSaving);
  document.getElementById('heroLifetime').textContent=money(best.lifetimeSaving);
}

function runAll(){
  try{
    const p=buildParams();
    const time=linspaceStep(0,p.t_total,p.dt);
    const timeHours=time.map(v=>v/60);
    const baseRaw=computeBase(p,time);
    const base=computeBaseSummary(p,baseRaw);
    const result=findBestCase(p,time,base);
    updateHero(result.best);
    plotFigures(p,timeHours,base,result.best);
    document.getElementById('summaryBox').textContent = [
      `Cooling tower total size = ${p.CT_TR_Total.toFixed(0)} TR`,
      `Blowdown deadband = 250 µS/cm`,
      `Initial sump conductivity = Makeup Conductivity × CoC - 250 = ${p.C_Sump_init.toFixed(0)} µS/cm`,
      `Estimated operating hours = ${Math.round(p.hours_year).toLocaleString()} hr/yr (${p.Operation_duty_pct.toFixed(1)}% duty)`,
      `Best NONA case = ${result.best.label}`,
      `Estimated first-year saving = ${money(result.best.annualSaving)}/yr`,
      `Estimated lifetime saving = ${money(result.best.lifetimeSaving)} (${p.Lifetime_years} yr, ${(100*p.Inflation_rate).toFixed(1)}% inflation)`
    ].join('\\n');
  } catch(err){
    console.error(err);
  }
}

document.getElementById('runBtn').addEventListener('click',runAll);
document.getElementById('resetBtn').addEventListener('click',()=>{
  ['CT_TR_Unit','CT_Number','C_MU','CoC','cost_MU','cost_SW','cost_E','Operation_duty_pct','Inflation_rate_pct','Lifetime_years'].forEach(k=>setVal(k,defaults[k]));
  runAll();
});
window.addEventListener('load',runAll);
</script>
